<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahiru AI — Chat</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { display:flex; height:100vh; overflow:hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px 14px;
      margin: 14px 14px 8px;
      width: calc(100% - 28px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text2);
      font-size: 0.84rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .new-chat-btn:hover { background: var(--surface3); color: var(--text); }

    .sidebar-section {
      padding: 6px 10px 4px;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .chat-item {
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
      position: relative;
      group: '';
    }
    .chat-item:hover { background: var(--surface2); }
    .chat-item.active { background: var(--surface3); }
    .chat-item-icon { font-size: 13px; opacity: 0.5; flex-shrink: 0; }
    .chat-item-title {
      font-size: 0.82rem;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .chat-item.active .chat-item-title { color: var(--text); }
    .chat-item-del {
      display: none;
      background: none;
      color: var(--muted);
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .chat-item:hover .chat-item-del { display: block; }
    .chat-item-del:hover { color: var(--red); }

    .sidebar-footer {
      border-top: 1px solid var(--border2);
      padding: 12px 14px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .user-chip:hover { background: var(--surface2); }
    .user-avatar {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f0b429, #d97706);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #0a0800;
      font-family: 'Syne', sans-serif;
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 0.82rem; font-weight: 600; }
    .user-role { font-size: 0.68rem; color: var(--muted); }
    .user-chip-actions { display: flex; gap: 4px; }
    .chip-btn {
      background: none;
      color: var(--muted);
      font-size: 13px;
      padding: 4px;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
    }
    .chip-btn:hover { color: var(--text); background: var(--surface3); }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .topbar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      flex-shrink: 0;
    }

    .model-selector-wrap { position: relative; }
    .model-selector-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 600;
      transition: border-color 0.2s, background 0.2s;
    }
    .model-selector-btn:hover { background: var(--surface2); border-color: rgba(255,255,255,0.1); }
    .model-selector-btn .chevron { font-size: 10px; color: var(--muted); transition: transform 0.2s; }
    .model-selector-btn.open .chevron { transform: rotate(180deg); }

    .model-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 300px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      z-index: 100;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      display: none;
    }
    .model-dropdown.open { display: block; animation: fadeDown 0.15s ease both; }

    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      padding: 7px 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 14px;
      transition: all 0.15s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface2); }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
    }

    .msg-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .message {
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
      animation: fadeUp 0.2s ease both;
    }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .msg-avatar.user {
      background: linear-gradient(135deg, #f0b429, #d97706);
      color: #0a0800;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      font-size: 12px;
    }

    .msg-avatar.ai {
      background: var(--surface3);
      border: 1px solid var(--border);
    }

    .msg-body { flex: 1; min-width: 0; padding-top: 4px; }
    .msg-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .msg-author { font-size: 0.82rem; font-weight: 700; }
    .msg-time { font-size: 0.7rem; color: var(--muted); }
    .msg-model-badge {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .msg-content {
      font-size: 0.9rem;
      line-height: 1.75;
      color: var(--text);
    }

    .msg-content p { margin-bottom: 10px; }
    .msg-content p:last-child { margin-bottom: 0; }

    .msg-content pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
      font-size: 0.82rem;
      position: relative;
    }

    .msg-content code:not(pre code) {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.83em;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .msg-content pre code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--text);
    }

    .copy-code-btn {
      position: absolute;
      top: 8px; right: 8px;
      padding: 3px 8px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      font-size: 0.7rem;
      transition: all 0.15s;
    }
    .copy-code-btn:hover { color: var(--text); background: var(--surface); }

    .msg-content ul, .msg-content ol {
      padding-left: 20px;
      margin-bottom: 10px;
    }
    .msg-content li { margin-bottom: 4px; }

    .msg-content h1,.msg-content h2,.msg-content h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      margin: 16px 0 8px;
    }

    .msg-content strong { color: var(--text); font-weight: 600; }

    .msg-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .msg-action-btn {
      padding: 4px 8px;
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.72rem;
      display: flex; align-items: center; gap: 4px;
      transition: all 0.15s;
    }
    .msg-action-btn:hover { background: var(--surface2); border-color: var(--border); color: var(--text2); }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-dot {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: pulse 1.2s ease infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* Streaming cursor */
    .streaming-cursor::after {
      content: '▋';
      color: var(--gold);
      animation: pulse 0.8s step-end infinite;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 48px 24px;
      text-align: center;
    }

    .empty-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #f0b429, #fbbf24, #d97706);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 32px rgba(240,180,41,0.2);
      margin-bottom: 20px;
    }

    .empty-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .empty-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 32px; }

    .suggestion-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 480px;
      width: 100%;
    }

    .suggestion-card {
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .suggestion-card:hover { background: var(--surface2); border-color: rgba(255,255,255,0.1); }
    .suggestion-card .s-icon { font-size: 18px; margin-bottom: 8px; }
    .suggestion-card .s-title { font-size: 0.82rem; font-weight: 600; margin-bottom: 3px; }
    .suggestion-card .s-desc { font-size: 0.72rem; color: var(--muted); }

    /* ── Input area ── */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border2);
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-box {
      max-width: 760px;
      margin: 0 auto;
    }

    .input-wrap {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap:focus-within {
      border-color: rgba(240,180,41,0.35);
      box-shadow: 0 0 0 3px var(--glow);
    }

    #chatInput {
      width: 100%;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 14px 52px 14px 16px;
      font-size: 0.92rem;
      resize: none;
      max-height: 160px;
      min-height: 52px;
      line-height: 1.6;
    }
    #chatInput:focus { box-shadow: none; border-color: transparent; }

    .send-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #f0b429, #d97706);
      border-radius: 9px;
      color: #0a0800;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .send-btn:hover { opacity: 0.9; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .stop-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 34px; height: 34px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text2);
      display: none;
      align-items: center; justify-content: center;
      font-size: 12px;
      transition: all 0.15s;
    }
    .stop-btn.show { display: flex; }
    .stop-btn:hover { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.3); }

    .input-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 0;
    }
    .input-hint { font-size: 0.7rem; color: var(--muted2); }
    .char-count { font-size: 0.7rem; color: var(--muted2); }
    .char-count.warn { color: var(--gold); }

    /* ── Model picker ── */
    .model-picker-section {
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 8px 4px;
    }

    /* ── Settings panel ── */
    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .settings-overlay.open { display: flex; }

    .settings-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 460px;
      max-height: 80vh;
      overflow-y: auto;
      animation: fadeUp 0.2s ease both;
    }

    .settings-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; }

    .settings-body { padding: 24px; }

    .settings-section {
      margin-bottom: 24px;
    }
    .settings-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .close-btn {
      background: none;
      color: var(--muted);
      font-size: 18px;
      transition: color 0.15s;
    }
    .close-btn:hover { color: var(--text); }

    /* ── Rate limit bar ── */
    .rate-bar-wrap { margin-top: 8px; }
    .rate-bar-track { height: 4px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
    .rate-bar-fill { height: 100%; border-radius: 2px; background: var(--gold); transition: width 0.3s; }
    .rate-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }

    @media(max-width:768px) {
      .sidebar { display: none; }
      .topbar { padding: 12px 16px; }
      .input-area { padding: 12px 16px 16px; }
      .msg-wrap { padding: 0 16px; }
      .suggestion-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="mahiru-mark">
        <div class="logo">✦</div>
        <div><div class="name">Mahiru</div><span class="sub">by LangitDev</span></div>
      </div>
    </div>

    <button class="new-chat-btn" onclick="MahiruChat.newChat()">
      <span>＋</span> New Chat
    </button>

    <div class="sidebar-section">Percakapan</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">
      <div class="user-chip" id="userChip">
        <div class="user-avatar" id="userAvatar">M</div>
        <div class="user-info">
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">user</div>
        </div>
        <div class="user-chip-actions">
          <button class="chip-btn" title="Settings" onclick="openSettings()">⚙</button>
          <button class="chip-btn" title="Logout" onclick="handleLogout()">↪</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="model-selector-wrap">
        <button class="model-selector-btn" id="modelSelectorBtn" onclick="toggleModelDropdown()">
          <span id="modelIcon">✦</span>
          <span id="modelLabel">MahiruX Ultra</span>
          <span class="chevron">▾</span>
        </button>
        <div class="model-dropdown" id="modelDropdown"></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="Clear chat" onclick="MahiruChat.clearMessages()">🗑</button>
        <button class="icon-btn" title="Settings" onclick="openSettings()">⚙</button>
        <button class="icon-btn admin-only hidden" title="Admin" onclick="window.location.href='admin.html'" id="adminBtn">🛡</button>
      </div>
    </div>

    <!-- Messages area -->
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-logo">✦</div>
        <div class="empty-title">Halo, <span id="emptyName">—</span>!</div>
        <div class="empty-sub">Mulai percakapan dengan Mahiru AI</div>
        <div class="suggestion-grid" id="suggestionGrid"></div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-box">
        <div class="input-wrap">
          <textarea id="chatInput" placeholder="Ketik pesan..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="MahiruChat.sendMessage()">➤</button>
          <button class="stop-btn" id="stopBtn" onclick="MahiruChat.stopStream()">■</button>
        </div>
        <div class="input-meta">
          <div class="input-hint">Enter kirim · Shift+Enter baris baru</div>
          <div class="char-count" id="charCount"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Settings overlay -->
  <div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsOnOverlay(event)">
    <div class="settings-panel">
      <div class="settings-header">
        <div class="settings-title">⚙ Settings</div>
        <button class="close-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <div class="settings-section-title">API Keys</div>
          <div class="form-group">
            <label>Gemini API Key</label>
            <div style="position:relative">
              <input type="password" id="geminiKey" placeholder="AIza...">
              <button class="eye-btn" onclick="togglePwSettings('geminiKey',this)" type="button">👁</button>
            </div>
          </div>
          <div class="form-group">
            <label>Grok / xAI API Key</label>
            <div style="position:relative">
              <input type="password" id="grokKey" placeholder="xai-...">
              <button class="eye-btn" onclick="togglePwSettings('grokKey',this)" type="button">👁</button>
            </div>
          </div>
        </div>

        <div class="settings-section" id="rateLimitSection">
          <div class="settings-section-title">Penggunaan</div>
          <div class="rate-label" id="rateLabel">— pesan dikirim jam ini</div>
          <div class="rate-bar-wrap">
            <div class="rate-bar-track"><div class="rate-bar-fill" id="rateBarFill" style="width:0%"></div></div>
          </div>
        </div>

        <button class="btn-primary" onclick="saveSettings()" style="margin-top:8px">Simpan Settings</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/chat.js"></script>
</body>
</html>
