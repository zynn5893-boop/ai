<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahiru AI — Admin</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { display:flex; height:100vh; overflow:hidden; }

    /* ── Admin Sidebar ── */
    .admin-sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .admin-sidebar-header {
      padding: 20px 18px;
      border-bottom: 1px solid var(--border2);
    }

    .admin-nav { padding: 12px 10px; flex: 1; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
      color: var(--text2);
      transition: all 0.15s;
      background: none;
      width: 100%;
      text-align: left;
      border: none;
      font-family: 'Instrument Sans', sans-serif;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--surface3); color: var(--text); font-weight: 600; }
    .nav-item .nav-icon { font-size: 15px; width: 20px; text-align: center; }

    .admin-sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border2);
    }

    /* ── Main content ── */
    .admin-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .admin-topbar {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .admin-topbar-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .admin-content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    /* ── Stat cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .stat-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Section ── */
    .admin-section { margin-bottom: 28px; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
    }

    /* ── Table ── */
    .data-table {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .data-table table { width: 100%; border-collapse: collapse; }

    .data-table th {
      padding: 10px 16px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      text-align: left;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 12px 16px;
      font-size: 0.84rem;
      border-bottom: 1px solid var(--border2);
      vertical-align: middle;
    }

    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(255,255,255,0.015); }

    .user-row-avatar {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: var(--surface3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      margin-right: 8px;
      vertical-align: middle;
    }

    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.active { background: var(--green); }
    .status-dot.banned { background: var(--red); }

    .row-actions { display: flex; gap: 6px; align-items: center; }

    /* ── Audit log ── */
    .audit-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border2);
      font-size: 0.82rem;
    }
    .audit-item:last-child { border-bottom: none; }
    .audit-event {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .audit-login    { background: rgba(74,222,128,0.1); color: var(--green); }
    .audit-logout   { background: rgba(168,167,184,0.1); color: var(--text2); }
    .audit-register { background: rgba(96,165,250,0.1); color: #60a5fa; }
    .audit-fail     { background: rgba(248,113,113,0.1); color: var(--red); }
    .audit-locked   { background: rgba(248,113,113,0.15); color: var(--red); }
    .audit-other    { background: var(--surface3); color: var(--text2); }

    .audit-meta { flex: 1; min-width: 0; }
    .audit-user { font-weight: 600; color: var(--text); }
    .audit-time { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    /* ── Settings form ── */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ── Tabs ── */
    .admin-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .admin-tab {
      padding: 10px 18px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: none;
      transition: all 0.15s;
      font-family: 'Instrument Sans', sans-serif;
    }
    .admin-tab:hover { color: var(--text2); }
    .admin-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .empty-table {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 0.84rem;
    }

    @media(max-width:900px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .settings-grid { grid-template-columns: 1fr; }
    }

    @media(max-width:600px) {
      .admin-sidebar { display: none; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <div class="mahiru-mark">
        <div class="logo">✦</div>
        <div><div class="name">Mahiru</div><span class="sub">Admin Panel</span></div>
      </div>
    </div>
    <nav class="admin-nav">
      <button class="nav-item active" onclick="showTab('overview')" data-tab="overview">
        <span class="nav-icon">◉</span> Overview
      </button>
      <button class="nav-item" onclick="showTab('users')" data-tab="users">
        <span class="nav-icon">👥</span> Users
      </button>
      <button class="nav-item" onclick="showTab('audit')" data-tab="audit">
        <span class="nav-icon">📋</span> Audit Log
      </button>
      <button class="nav-item" onclick="showTab('settings')" data-tab="settings">
        <span class="nav-icon">⚙</span> Settings
      </button>
    </nav>
    <div class="admin-sidebar-footer">
      <button class="nav-item" onclick="window.location.href='chat.html'" style="color:var(--muted)">
        <span class="nav-icon">←</span> Kembali ke Chat
      </button>
      <button class="nav-item" onclick="handleLogout()" style="color:var(--red)">
        <span class="nav-icon">↪</span> Logout
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="admin-topbar-title" id="pageTitle">Overview</div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge badge-gold">🛡 Admin</span>
        <span style="font-size:0.82rem;color:var(--muted)" id="topbarUser">—</span>
      </div>
    </div>

    <div class="admin-content">

      <!-- Overview -->
      <div class="tab-panel active" id="tab-overview">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Users</div>
            <div class="stat-value text-gold" id="statUsers">0</div>
            <div class="stat-sub">terdaftar</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Pesan</div>
            <div class="stat-value" id="statMessages">0</div>
            <div class="stat-sub">semua user</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">User Aktif</div>
            <div class="stat-value text-green" id="statActive">0</div>
            <div class="stat-sub">tidak diblokir</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Audit Events</div>
            <div class="stat-value" id="statAudit">0</div>
            <div class="stat-sub">total log</div>
          </div>
        </div>

        <div class="admin-section">
          <div class="section-header">
            <div class="section-title">Aktivitas Terbaru</div>
          </div>
          <div class="data-table">
            <div id="recentAudit">
              <div class="empty-table">Memuat...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Users -->
      <div class="tab-panel" id="tab-users">
        <div class="admin-section">
          <div class="section-header">
            <div class="section-title">Manajemen User</div>
            <div style="display:flex;gap:8px">
              <input type="text" id="userSearch" placeholder="Cari username..." style="padding:7px 12px;font-size:0.84rem;width:200px" oninput="filterUsers(this.value)">
            </div>
          </div>
          <div class="data-table">
            <table>
              <thead>
                <tr>
                  <th>User</th>
                  <th>Role</th>
                  <th>Pesan</th>
                  <th>Bergabung</th>
                  <th>Last Login</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="usersTable">
                <tr><td colspan="7" class="empty-table">Memuat...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Audit -->
      <div class="tab-panel" id="tab-audit">
        <div class="admin-section">
          <div class="section-header">
            <div class="section-title">Audit Log</div>
            <div style="display:flex;gap:8px">
              <select id="auditFilter" onchange="renderAudit()" style="padding:7px 12px;font-size:0.84rem">
                <option value="">Semua Events</option>
                <option value="LOGIN">Login</option>
                <option value="LOGOUT">Logout</option>
                <option value="REGISTER">Register</option>
                <option value="LOGIN_FAIL">Login Gagal</option>
                <option value="ACCOUNT_LOCKED">Account Locked</option>
              </select>
              <button class="btn-secondary" onclick="clearAudit()">Hapus Log</button>
            </div>
          </div>
          <div class="data-table">
            <div id="auditLog">
              <div class="empty-table">Memuat...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="tab-panel" id="tab-settings">
        <div class="admin-section">
          <div class="section-title" style="margin-bottom:20px">Konfigurasi Sistem</div>

          <div class="settings-grid">
            <div class="form-group">
              <label>Gemini API Key</label>
              <div style="position:relative">
                <input type="password" id="adminGeminiKey" placeholder="AIza...">
                <button class="eye-btn" onclick="togglePwSettings('adminGeminiKey',this)" type="button">👁</button>
              </div>
            </div>
            <div class="form-group">
              <label>Grok / xAI API Key</label>
              <div style="position:relative">
                <input type="password" id="adminGrokKey" placeholder="xai-...">
                <button class="eye-btn" onclick="togglePwSettings('adminGrokKey',this)" type="button">👁</button>
              </div>
            </div>
            <div class="form-group">
              <label>Limit Pesan / Jam</label>
              <input type="number" id="msgLimitPerHour" min="1" max="500" value="50">
            </div>
            <div class="form-group">
              <label>Registrasi Publik</label>
              <select id="allowRegister">
                <option value="1">Diizinkan</option>
                <option value="0">Dinonaktifkan</option>
              </select>
            </div>
          </div>

          <button class="btn-primary" onclick="saveAdminSettings()" style="max-width:200px;margin-top:8px">
            Simpan Settings
          </button>
        </div>

        <div class="admin-section" style="border-top:1px solid var(--border);padding-top:24px">
          <div class="section-title" style="margin-bottom:12px;color:var(--red)">Danger Zone</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn-danger" onclick="confirmClearAll()">🗑 Hapus Semua Data Chat</button>
            <button class="btn-danger" onclick="exportData()">📤 Export Data Users</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="assets/auth.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
